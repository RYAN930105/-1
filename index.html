<!DOCTYPE html>
<html>
<head>
    <title>英雄競技場：自動連戰版</title>
    <style>
        body { text-align: center; background: #0a0a0c; color: white; font-family: "Microsoft JhengHei", sans-serif; overflow: hidden; margin: 0; }
        canvas { background: #161d23; border: 2px solid #4b6584; display: block; margin: 5px auto; }
        .ui-container { padding: 10px; background: #1e272e; border-bottom: 2px solid #4b6584; }
        .stats-bar { display: flex; justify-content: center; gap: 40px; align-items: center; margin-top: 5px; }
        .timer { font-family: monospace; font-size: 32px; color: #ffeaa7; min-width: 140px; }
        .score-board { font-size: 18px; color: #0fbcf9; margin-bottom: 5px; }
        
        button { padding: 10px 20px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; margin: 0 5px; color: white; transition: 0.2s; }
        button:disabled { background: #2d3436 !important; cursor: not-allowed; opacity: 0.5; }
        #startBtn { background: #0fbcf9; }
        #restartBtn { background: #ff4757; } 
        #menuBtn { background: #4b6584; }
        
        #selectOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,10,12,0.98); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .selection-box { display: flex; gap: 30px; margin: 20px; }
        .player-panel { background: #1e272e; padding: 20px; border-radius: 12px; border: 2px solid #4b6584; width: 280px; }
        .preview-img { width: 80px; height: 80px; background: #0a0a0c; border: 1px solid #4b6584; margin: 10px auto; display: flex; align-items: center; justify-content: center; }
        .preview-img img { max-width: 100%; max-height: 100%; }
        select { width: 100%; padding: 8px; background: #2d3436; color: white; border: 1px solid #4b6584; border-radius: 5px; margin-top: 5px;}
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); padding: 40px; display: none; border: 3px solid #ff4757; border-radius: 15px; z-index: 1000; }
    </style>
</head>
<body>

    <div id="selectOverlay">
        <h1 style="color: #0fbcf9;">英雄整備選單</h1>
        <div class="selection-box">
            <div class="player-panel" style="border-color: #ff7675;">
                <h3>P1 設定 (WASD + 空白鍵)</h3>
                <div class="preview-img"><img id="p1Pre" src="p1.png"></div>
                <select id="p1Skin" onchange="document.getElementById('p1Pre').src=this.value">
                    <option value="p1.png">機體 P1</option><option value="p2.png">機體 P2</option><option value="p3.png">機體 P3</option>
                    <option value="p4.png">機體 P4</option><option value="p5.png">機體 P5</option><option value="p6.png">機體 P6</option>
                </select>
                <select id="p1WepSelect">
                    <option value="pistol">手槍 (W3)</option><option value="mg" selected>機槍 (W2)</option>
                    <option value="laser">雷射 (W1)</option><option value="spread">散彈 (W4)</option>
                </select>
            </div>
            <div class="player-panel" style="border-color: #74b9ff;">
                <h3>P2 設定 (方向鍵 + ENTER)</h3>
                <div class="preview-img"><img id="p2Pre" src="p2.png"></div>
                <select id="p2Skin" onchange="document.getElementById('p2Pre').src=this.value">
                    <option value="p2.png">機體 P2</option><option value="p1.png">機體 P1</option><option value="p3.png">機體 P3</option>
                    <option value="p4.png">機體 P4</option><option value="p5.png">機體 P5</option><option value="p6.png">機體 P6</option>
                </select>
                <select id="p2WepSelect">
                    <option value="pistol">手槍 (W3)</option><option value="mg" selected>機槍 (W2)</option>
                    <option value="laser">雷射 (W1)</option><option value="spread">散彈 (W4)</option>
                </select>
            </div>
        </div>
        <button onclick="confirmSetup()" style="padding:15px 40px; background:#00b894; border-radius:10px; font-size:18px;">啟動戰場</button>
    </div>

    <div class="ui-container">
        <div class="score-board">🏆 P1: <span id="p1Wins">0</span> | P2: <span id="p2Wins">0</span></div>
        <div class="stats-bar">
            <div>P1 <span id="p1H" style="color:#ff7675; font-size:20px;">❤❤❤❤❤</span> <span id="p1W"></span></div>
            <div class="timer" id="gameTimer">00:40</div>
            <div>P2 <span id="p2H" style="color:#74b9ff; font-size:20px;">❤❤❤❤❤</span> <span id="p2W"></span></div>
        </div>
        <div class="btn-group">
            <button id="startBtn" onclick="startGame()">戰鬥開始</button>
            <button id="restartBtn" onclick="resetGame()">場地重置</button>
            <button id="menuBtn" onclick="document.getElementById('selectOverlay').style.display='flex'">英雄選單</button>
        </div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="gameOver">
        <h2 id="winnerText" style="font-size: 36px;"></h2>
        <button onclick="nextRound()" style="background:#0fbcf9">下一回合</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const imgs = {};
        ['p1.png','p2.png','p3.png','p4.png','p5.png','p6.png','W1.png','W2.png','W3.png','W4.png','W6.png','W7.png'].forEach(s => {
            imgs[s] = new Image(); imgs[s].src = s;
        });

        let audioCtx = null;
        let lastSfxTime = 0;
        function playSfx(freq, type, dur, vol) {
            if (!audioCtx) return;
            const now = performance.now();
            if (now - lastSfxTime < 30) return; 
            lastSfxTime = now;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch(e){}
        }

        const wepInfo = {
            pistol: { n: '手槍', cd: 450, c: '#fff', img: 'W3.png' },
            mg: { n: '機槍', cd: 150, c: '#a55eea', img: 'W2.png' },
            laser: { n: '雷射', cd: 1500, dur: 1000, c: '#f1c40f', img: 'W1.png' },
            spread: { n: '散彈', cd: 800, c: '#0fbcf9', img: 'W4.png' },
            heal: { n: '醫藥箱', img: 'W7.png' }
        };

        let p1Wins = 0, p2Wins = 0, gameActive = false, frameReq = null;
        let gameStartTime, shrink = 0, items = [], traps = [], bullets = [], walls = [];
        let nextItemTime = 0, nextTrapTime = 0;
        const keys = {};

        let p1 = { x: 80, y: 230, hp: 5, skin: 'p1.png', wep: 'mg', base: 'mg', wepEnd: 0, dir: {x:1, y:0}, flash: 0, laser: 0, lastF: 0 };
        let p2 = { x: 680, y: 230, hp: 5, skin: 'p2.png', wep: 'mg', base: 'mg', wepEnd: 0, dir: {x:-1, y:0}, flash: 0, laser: 0, lastF: 0 };

        function confirmSetup() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            p1.skin = document.getElementById('p1Skin').value;
            p1.base = document.getElementById('p1WepSelect').value;
            p2.skin = document.getElementById('p2Skin').value;
            p2.base = document.getElementById('p2WepSelect').value;
            document.getElementById('selectOverlay').style.display = 'none';
            resetGame();
        }

        function resetGame() {
            gameActive = false;
            document.getElementById('startBtn').disabled = false; // 恢復按鈕
            if (frameReq) cancelAnimationFrame(frameReq);
            frameReq = null;
            bullets = []; items = []; traps = []; walls = []; shrink = 0;
            p1.x = 80; p1.y = 230; p1.hp = 5; p1.wep = p1.base; p1.laser = 0; p1.flash = 0; p1.lastF = 0;
            p2.x = 680; p2.y = 230; p2.hp = 5; p2.wep = p2.base; p2.laser = 0; p2.flash = 0; p2.lastF = 0;
            for(let i=0; i<3; i++) {
                walls.push({ x: 250+Math.random()*300, y: 100+Math.random()*300, vx: Math.random()>0.5?1.3:-1.3, vy: Math.random()>0.5?1.3:-1.3 });
            }
            document.getElementById('gameOver').style.display = 'none';
            updateUI(); render();
        }

        // 2. 下一回合自動開始
        function nextRound() {
            resetGame();
            startGame();
        }

        function startGame() {
            if (gameActive) return; // 1. 進行中禁止再次啟動
            document.getElementById('startBtn').disabled = true; // 1. 鎖定按鈕
            
            if (frameReq) cancelAnimationFrame(frameReq);
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            gameActive = true;
            gameStartTime = performance.now();
            nextItemTime = gameStartTime + 3000;
            nextTrapTime = gameStartTime + 5000;
            frameReq = requestAnimationFrame(mainLoop);
        }

        function updateUI() {
            document.getElementById('p1H').innerText = "❤".repeat(Math.max(0, Math.ceil(p1.hp)));
            document.getElementById('p2H').innerText = "❤".repeat(Math.max(0, Math.ceil(p2.hp)));
            document.getElementById('p1W').innerText = `[${wepInfo[p1.wep].n}]`;
            document.getElementById('p2W').innerText = `[${wepInfo[p2.wep].n}]`;
            document.getElementById('p1Wins').innerText = p1Wins;
            document.getElementById('p2Wins').innerText = p2Wins;
        }

        window.onkeydown = e => {
            keys[e.code] = true;
            // 1. 如果遊戲沒在跑，按 Enter 就啟動 (且防止重複觸發)
            if (e.code === 'Enter' && !gameActive && document.getElementById('gameOver').style.display !== 'block' && document.getElementById('selectOverlay').style.display === 'none') {
                startGame();
            }
        };
        window.onkeyup = e => keys[e.code] = false;

        function fire(p, now) {
            const info = wepInfo[p.wep];
            if (now - p.lastF < info.cd) return;
            p.lastF = now;
            if (p.wep === 'laser') {
                p.laser = now + info.dur;
                playSfx(400, 'sawtooth', 0.5, 0.1);
            } else {
                let count = (p.wep === 'spread') ? 3 : 1;
                for(let i=0; i<count; i++){
                    let spread = (p.wep === 'mg') ? (Math.random()-0.5)*0.1 : (p.wep==='spread'?(i-1)*0.25:0);
                    let angle = Math.atan2(p.dir.y, p.dir.x) + spread;
                    bullets.push({ x: p.x+22, y: p.y+22, vx: Math.cos(angle)*12, vy: Math.sin(angle)*12, owner: p, c: info.c });
                }
                playSfx(600, 'sine', 0.1, 0.1);
            }
        }

        function mainLoop(currentTime) {
            if(!gameActive) return;
            const now = currentTime; 
            const sec = (now - gameStartTime)/1000;
            if (sec > 40) shrink = Math.min(240, (sec-40)*15);
            document.getElementById('gameTimer').innerText = sec > 40 ? "SURVIVAL" : `00:${String(Math.floor(40-sec)).padStart(2,'0')}`;

            walls.forEach(w => {
                w.x += w.vx; w.y += w.vy;
                if(w.x < 150 || w.x > 615) w.vx *= -1;
                if(w.y < 50 || w.y > 365) w.vy *= -1;
            });

            // 4. 道具與陷阱可出現在全圖任一位置 (0~800, 0~500)
            if(now > nextItemTime) {
                if(items.length < 6) {
                    const types = ['pistol','spread','laser','mg','heal']; // 3. 加入心臟 (heal)
                    items.push({x: Math.random()*760, y: Math.random()*460, t: types[Math.floor(Math.random()*5)]});
                }
                nextItemTime = now + 4000;
            }
            if(now > nextTrapTime) {
                if(traps.length < 6) traps.push({x: Math.random()*760, y: Math.random()*460});
                nextTrapTime = now + 6000;
            }

            [p1, p2].forEach((p, idx) => {
                let dx=0, dy=0;
                if(idx===0){ if(keys.KeyW)dy=-4; if(keys.KeyS)dy=4; if(keys.KeyA)dx=-4; if(keys.KeyD)dx=4; if(keys.Space)fire(p, now); }
                else { if(keys.ArrowUp)dy=-4; if(keys.ArrowDown)dy=4; if(keys.ArrowLeft)dx=-4; if(keys.ArrowRight)dx=4; if(keys.Enter)fire(p, now); }
                
                let nx = p.x+dx, ny = p.y+dy;
                let hitW = walls.some(w => nx < w.x+35 && nx+44 > w.x && ny < w.y+85 && ny+44 > w.y);
                if(nx > 0 && nx < 756 && !hitW) p.x = nx;
                if(ny > 0 && ny < 456 && !hitW) p.y = ny;
                
                if (p.x < shrink || p.x > 756-shrink || p.y < shrink || p.y > 456-shrink) {
                    p.hp -= 0.02; p.flash = 2;
                }

                if(dx!==0 || dy!==0) {
                    let mag = Math.sqrt(dx*dx+dy*dy);
                    if(mag > 0) { p.dir.x = dx/mag; p.dir.y = dy/mag; }
                }

                for(let i=items.length-1; i>=0; i--) {
                    if(Math.abs(items[i].x-p.x)<40 && Math.abs(items[i].y-p.y)<40) {
                        let it = items.splice(i,1)[0];
                        if(it.t === 'heal') {
                            p.hp = Math.min(5, p.hp + 1);
                            playSfx(900, 'sine', 0.2, 0.1); 
                        } else {
                            p.wep = it.t; 
                            p.wepEnd = now + 7000;
                            playSfx(880, 'sine', 0.2, 0.1); 
                        }
                        updateUI();
                    }
                }
                for(let i=traps.length-1; i>=0; i--) {
                    if(Math.abs(traps[i].x-p.x)<35 && Math.abs(traps[i].y-p.y)<35) {
                        traps.splice(i,1); p.hp--; p.flash=10; 
                        playSfx(100, 'square', 0.4, 0.2); 
                        updateUI();
                    }
                }

                if(p.wep !== p.base && now > p.wepEnd) p.wep = p.base;

                if(now < p.laser) {
                    let t = (idx===0) ? p2 : p1;
                    let dxL = t.x + 22 - (p.x + 22); let dyL = t.y + 22 - (p.y + 22);
                    if ((dxL * p.dir.x + dyL * p.dir.y) > 0 && Math.abs(dxL * p.dir.y - dyL * p.dir.x) < 40) {
                        t.hp -= 0.08; t.flash = 2;
                    }
                }
                if(p.flash > 0) p.flash--;
            });

            if (bullets.length > 150) bullets.splice(0, 50); 
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i]; b.x += b.vx; b.y += b.vy;
                let t = (b.owner === p1) ? p2 : p1;
                let hitW = false;
                for(let w of walls) { if(b.x > w.x && b.x < w.x+35 && b.y > w.y && b.y < w.y+85) { hitW = true; break; } }
                if(hitW || (b.x > t.x && b.x < t.x+44 && b.y > t.y && b.y < t.y+44)) {
                    if(!hitW) { 
                        t.hp--; t.flash=10; 
                        playSfx(220, 'sine', 0.15, 0.1); 
                    }
                    bullets.splice(i, 1); updateUI();
                } else if(b.x < 0 || b.x > 800 || b.y < 0 || b.y > 500) {
                    bullets.splice(i, 1);
                }
            }

            if(p1.hp <= 0 || p2.hp <= 0) {
                gameActive = false;
                if(p1.hp<=0) p2Wins++; else p1Wins++;
                document.getElementById('gameOver').style.display = 'block';
                document.getElementById('winnerText').innerText = p1.hp<=0?"藍方 P2 勝利":"紅方 P1 勝利";
                playSfx(150, 'sawtooth', 0.8, 0.2);
                updateUI();
                if (frameReq) cancelAnimationFrame(frameReq);
                return;
            }
            render();
            frameReq = requestAnimationFrame(mainLoop);
        }

        function render() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = "#161d23";
            ctx.fillRect(0,0,800,500);

            ctx.beginPath(); ctx.strokeStyle = "rgba(100, 149, 237, 0.2)"; ctx.lineWidth = 0.5;
            for(let i=0; i<=800; i+=40) { ctx.moveTo(i, 0); ctx.lineTo(i, 500); }
            for(let i=0; i<=500; i+=40) { ctx.moveTo(0, i); ctx.lineTo(800, i); }
            ctx.stroke();

            ctx.fillStyle = "rgba(255, 71, 87, 0.3)";
            ctx.fillRect(0,0,800,shrink); ctx.fillRect(0,500-shrink,800,shrink);
            ctx.fillRect(0,0,shrink,500); ctx.fillRect(800-shrink,0,shrink,500);

            ctx.fillStyle = "#4b6584";
            walls.forEach(w => ctx.fillRect(w.x, w.y, 35, 85));
            items.forEach(it => { 
                let imgKey = (it.t === 'heal') ? 'W7.png' : wepInfo[it.t].img;
                if(imgs[imgKey]) ctx.drawImage(imgs[imgKey], it.x, it.y, 30, 30); 
            });
            traps.forEach(tr => { if(imgs['W6.png']) ctx.drawImage(imgs['W6.png'], tr.x, tr.y, 30, 30); });

            [p1, p2].forEach(p => {
                const now = performance.now();
                if(now < p.laser) {
                    ctx.strokeStyle = "rgba(255, 234, 167, 0.8)"; ctx.lineWidth = 15;
                    ctx.beginPath(); ctx.moveTo(p.x+22, p.y+22);
                    ctx.lineTo(p.x+22+p.dir.x*800, p.y+22+p.dir.y*800); ctx.stroke();
                }
                ctx.save();
                ctx.translate(p.x+22, p.y+22);
                if(p.dir.x < 0) ctx.scale(-1, 1);
                ctx.rotate(Math.atan2(p.dir.y, Math.abs(p.dir.x)));
                if(p.flash > 0 && Math.floor(now/50) % 2 === 0) ctx.globalAlpha = 0.3;
                if(imgs[p.skin]) ctx.drawImage(imgs[p.skin], -22, -22, 45, 45);
                ctx.restore(); ctx.globalAlpha = 1;
            });

            bullets.forEach(b => {
                ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
            });
        }
        resetGame();
    </script>
</body>
</html>
